<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Maizic – Barcode Scanner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="https://unpkg.com/@zxing/library@latest"></script>
</head>

<body>
<div class="app">

  <h1>Maizic – Ultra Fast Barcode Scanner</h1>
  <p class="subtitle">Scan 1D barcodes using camera, detect duplicates (local + server), store batches locally.</p>

  <!-- ACTION BUTTONS -->
  <div class="row controls-row">
    <div class="col">
      <button class="btn btn-primary" id="startCameraBtn">▶ Start Camera</button>
      <button class="btn btn-danger" id="stopCameraBtn" disabled>■ Stop</button>
      <button class="btn btn-ghost" id="finishBatchBtn" disabled>✓ Finish Batch</button>
      <button class="btn btn-warning" id="clearStorageBtn">🧹 Clear Local Storage</button>
      <span class="badge" id="batchInfoBadge">Saved batches: 0</span>
    </div>
  </div>

  <!-- VIDEO PREVIEW -->
  <div class="video-wrapper">
    <video id="video" muted playsinline></video>
    <div id="successOverlay" class="overlay-flash overlay-success">✔</div>
    <div id="warningOverlay" class="overlay-flash overlay-warning">!</div>
  </div>

  <!-- CURRENT BATCH -->
  <div class="batch-section">
    <h2>Current Batch (<span id="batchCount">0</span>)</h2>

    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Barcode</th>
          <th>Format</th>
          <th>Duplicate?</th>
        </tr>
      </thead>

      <tbody id="batchTableBody">
        <tr><td colspan="4" class="empty-row">No barcodes scanned yet.</td></tr>
      </tbody>
    </table>
  </div>

</div>

<!-- DUPLICATE MODAL -->
<div id="duplicateModalBackdrop" class="modal-backdrop">
  <div class="modal">
    <h3>Duplicate Detected</h3>
    <p id="duplicateModalText"></p>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="duplicateCancelBtn">Remove</button>
      <button class="btn btn-primary" id="duplicateAddBtn">Keep</button>
    </div>
  </div>
</div>

<!-- FINISH MODAL -->
<div id="finishModalBackdrop" class="modal-backdrop">
  <div class="modal">
    <h3>Finish Batch</h3>
    <p>Select delivery partner:</p>
    <select id="partnerSelect">
      <option value="">-- Select --</option>
      <option value="Flipkart">Flipkart</option>
      <option value="Amazon">Amazon</option>
      <option value="BlueDart">BlueDart</option>
      <option value="DTDC">DTDC</option>
    </select>

    <div class="modal-actions">
      <button class="btn btn-ghost" id="finishCancelBtn">Cancel</button>
      <button class="btn btn-primary" id="finishConfirmBtn">Save</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast" class="toast"><span id="toastText"></span></div>

<script src="/main.js"></script>
</body>
</html>
